<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- DOMAIN ROUTER & CANONICAL -->
    <script>
        (function() {
            var host = window.location.hostname;
            var path = window.location.pathname;
            var search = window.location.search;
            var targetDomain = 'soulamore.com';
            
            // 1. Redirect Firebase Traffic
            if (host.includes('firebaseapp.com') || host.includes('web.app')) {
                window.location.replace('https://' + targetDomain + path + search);
            }
            
            // 2. Canonical Injection
            var canonicalUrl = 'https://' + targetDomain + path;
            var link = document.querySelector('link[rel="canonical"]') || document.createElement('link');
            link.rel = 'canonical';
            link.href = canonicalUrl;
            if (!link.parentNode) document.head.appendChild(link);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read full article on Soulamore Stories - mental health insights and expert guidance.">
    <title>Soulamore Stories</title>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Soulamore">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
        }

        body {
            background-color: #0b1120;
            color: #f8fafc;
        }

        body.light-mode {
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        /* --- READING PROGRESS BAR --- */
        #reading-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(to right, #4ECDC4, #fbbf24);
            width: 0%;
            z-index: 1000;
            transition: width 0.1s ease-out;
        }

        .post-container {
            width: 100%;
            max-width: 840px;
            margin: 0 auto;
            padding: 30px 20px 80px;
            position: relative;
            z-index: 10;
        }

        /* --- POST HERO --- */
        .post-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .post-meta {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 18px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .post-tag {
            background: rgba(78, 205, 196, 0.12);
            color: #4ECDC4;
            padding: 4px 12px;
            border-radius: 99px;
            font-weight: 700;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }

        .post-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 25px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-image {
            width: 100%;
            height: 420px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 35px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .hero-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- JOURNAL PAPER SHEET CONTAINER & WRITING SURFACE --- */
        .post-body {
            font-family: 'Lora', 'Patrick Hand', serif;
            font-size: 1.2rem;
            line-height: 1.85;
            color: #e2e8f0;
            background-color: #131a2a;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 0%, rgba(78, 205, 196, 0.08), transparent 75%);
            background-size: 100% 34px, 100% 100%;
            border-radius: 20px;
            padding: 50px 55px 60px 70px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px double rgba(244, 114, 182, 0.45); /* Journal red/pink margin line */
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5), 
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 0 80px rgba(0, 0, 0, 0.3);
            margin-bottom: 45px;
            transition: all 0.3s ease;
        }

        /* Notebook Binder Punch Holes on Left Margin */
        .post-body::before {
            content: '';
            position: absolute;
            top: 35px;
            left: 18px;
            bottom: 35px;
            width: 14px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.16) 4px, transparent 5px);
            background-size: 14px 42px;
            pointer-events: none;
        }

        /* Handwriting Mode Class (Toggleable) */
        .post-body.handwriting-mode {
            font-family: 'Patrick Hand', 'Caveat', cursive !important;
            font-size: 1.38rem !important;
            line-height: 1.75 !important;
            color: #f1f5f9 !important;
        }

        .post-body p {
            margin-bottom: 28px;
        }

        /* Journal Subheadings in Aesthetic Cursive Handwriting */
        .post-body h2,
        .post-body h3 {
            font-family: 'Caveat', 'Kalam', cursive;
            color: #4ECDC4;
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 2px dashed rgba(78, 205, 196, 0.3);
            padding-bottom: 6px;
            display: inline-block;
        }

        .post-body h2 {
            font-size: 2.3rem;
            line-height: 1.25;
        }

        .post-body h3 {
            font-size: 1.8rem;
        }

        /* Handwritten Sticky Callout Box */
        .post-body blockquote,
        .handwritten-callout {
            border-left: 4px solid #fbbf24;
            background: rgba(251, 191, 36, 0.08);
            padding: 20px 24px;
            margin: 32px 0;
            border-radius: 12px;
            font-family: 'Caveat', 'Kalam', cursive;
            font-style: normal;
            font-size: 1.4rem;
            line-height: 1.6;
            color: #fef08a;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            transform: rotate(-0.5deg);
        }

        .post-body blockquote::before {
            content: '📌 Note';
            display: block;
            font-size: 0.85rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #fbbf24;
            margin-bottom: 6px;
        }

        /* CODED STICK DIAGRAM & DOODLE CONTAINERS */
        .stick-diagram-box {
            background: rgba(11, 17, 32, 0.7);
            border: 2px dashed rgba(78, 205, 196, 0.4);
            border-radius: 16px;
            padding: 26px 20px;
            margin: 35px 0;
            text-align: center;
            position: relative;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .stick-diagram-caption {
            font-family: 'Caveat', 'Kalam', cursive;
            font-size: 1.35rem;
            color: #4ECDC4;
            margin-top: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stick-figure-svg {
            max-width: 100%;
            height: auto;
            stroke: #4ECDC4;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: drop-shadow(0 2px 8px rgba(78, 205, 196, 0.35));
        }

        /* FONT STYLE TOGGLE PILL */
        .journal-font-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 0.78rem;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-bottom: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
        }

        .journal-font-toggle:hover {
            color: #4ECDC4;
            border-color: rgba(78, 205, 196, 0.4);
            background: rgba(78, 205, 196, 0.08);
        }

        .post-body ul, .post-body ol {
            margin-bottom: 28px;
            padding-left: 24px;
        }

        .post-body li {
            margin-bottom: 10px;
        }

        /* --- AUTHOR BOX --- */
        .author-box {
            margin-top: 60px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .author-avatar-lg {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4ECDC4;
            flex-shrink: 0;
        }

        .author-info {
            flex: 1;
            min-width: 240px;
        }

        .author-role {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4ECDC4;
            margin-bottom: 4px;
            display: block;
        }

        .author-info h4 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #fff;
        }

        .author-bio {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 0;
            line-height: 1.5;
        }

        /* --- ENGAGEMENT BAR --- */
        .engage-bar {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 10px 24px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }

        .engage-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 600;
        }

        .engage-btn:hover {
            color: #4ECDC4;
            transform: scale(1.1);
        }

        .engage-btn.active {
            color: #ef4444;
        }

        /* --- RELATED STORIES --- */
        .related-section {
            margin-top: 70px;
            padding-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .related-section h3 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }

        .related-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .related-card:hover {
            transform: translateY(-4px);
            border-color: rgba(78, 205, 196, 0.3);
        }

        .related-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
        }

        .related-card-body {
            padding: 16px;
        }

        .related-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 6px;
            line-height: 1.35;
        }

        /* LIGHT MODE OVERRIDES */
        body.light-mode {
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        body.light-mode .post-body {
            color: var(--text-primary);
        }

        body.light-mode .post-title,
        body.light-mode .post-body h2,
        body.light-mode .post-body h3,
        body.light-mode .author-info h4 {
            color: var(--text-primary);
        }

        body.light-mode .author-box {
            background: var(--bg-card);
            border-color: var(--border-subtle);
        }

        body.light-mode .engage-bar {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--border-subtle);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.15);
        }
    </style>

    <!-- SEO & OPEN GRAPH META TAGS -->
    <meta name="description" content="Read full article on Soulamore Stories - mental health insights and expert guidance.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://soulamore.com/community/blogs/blog-detail.html">
    <meta property="og:title" content="Soulamore Stories">
    <meta property="og:description" content="Read full article on Soulamore Stories - mental health insights and expert guidance.">
    <meta property="og:image" content="https://soulamore.com/assets/images/favicon_symbol.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Soulamore Stories">
    <meta name="twitter:description" content="Read full article on Soulamore Stories - mental health insights and expert guidance.">
    <meta name="twitter:image" content="https://soulamore.com/assets/images/favicon_symbol.webp">
</head>

<body>
    <!-- READING PROGRESS INDICATOR -->
    <div id="reading-progress"></div>

    <div id="app-shell">
        <div id="shell-fixed">
            <header></header>
        </div>

        <!-- PARTICLES BACKGROUND -->
        <div id="particles" style="position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:-1;"></div>

        <main id="shell-content">
            <div class="post-container" id="mainContent">
                <!-- Content injected dynamically by JS -->
            </div>

            <!-- RELATED STORIES SECTION -->
            <div class="post-container" style="padding-top:0;">
                <div class="related-section" id="relatedSection">
                    <h3>Explore More Stories</h3>
                    <div class="related-grid" id="relatedGrid"></div>
                </div>
            </div>

            <!-- ENGAGEMENT FLOATING BAR -->
            <aside class="engage-bar" id="engageBar" style="display:none;">
                <button class="engage-btn" id="likeBtn" onclick="toggleLike(this)">
                    <i class="fas fa-heart"></i>
                    <span id="likeCount">0</span>
                </button>
                <div style="width:1px; height:18px; background:rgba(255,255,255,0.15);"></div>
                <button class="engage-btn" onclick="copyLink()" title="Copy Article Link">
                    <i class="fas fa-link"></i>
                </button>
                <button class="engage-btn" onclick="shareTwitter()" title="Share on Twitter">
                    <i class="fab fa-twitter"></i>
                </button>
            </aside>
        </main>

        <footer></footer>
    </div>

    <!-- SCRIPTS -->
    <script src="../../assets/js/components.js?v=3.6"></script>
    <script type="module">
        // FIXED IMPORT PATHS FROM BLOG-DETAIL.HTML TO ROOT ASSETS (../../assets/js/)
        import { getPostById, getAllPosts } from '../../assets/js/blog-data.js';
        import { db, doc, getDoc, setDoc, updateDoc, increment } from '../../assets/js/firebase-config.js';

        // 1. Get ID from URL
        const params = new URLSearchParams(window.location.search);
        const postId = params.get('id');
        const container = document.getElementById('mainContent');
        const engageBar = document.getElementById('engageBar');
        const relatedGrid = document.getElementById('relatedGrid');

        let isLikeUpdating = false;

        // Reading progress listener
        window.addEventListener('scroll', () => {
            const winScroll = document.documentElement.scrollTop || document.body.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            const progressEl = document.getElementById('reading-progress');
            if (progressEl) progressEl.style.width = (scrolled || 0) + '%';
        });

        async function initPost() {
            if (!postId) {
                container.innerHTML = `<div style="text-align:center; padding:80px 20px;"><h2>Post not found</h2><a href="blogs.html" style="color:#4ECDC4;">Back to Stories</a></div>`;
                return;
            }

            const post = getPostById(postId);

            if (post) {
                // UPDATE METADATA
                document.title = `${post.title} | Soulamore Stories`;

                // RENDER MAIN POST
                container.innerHTML = `
                    <div class="post-header fade-in">
                        <div class="post-meta">
                            <span class="post-tag">${post.topic || 'Mental Health'}</span>
                            <span>•</span>
                            <span><i class="far fa-clock" style="margin-right:4px;"></i>${post.readTime || '5 min read'}</span>
                            <span>•</span>
                            <span>${post.date}</span>
                        </div>
                        <h1 class="post-title">${post.title}</h1>
                    </div>

                    <div class="hero-image fade-in">
                        <img src="${post.image}" alt="${post.title}">
                    </div>

                    <article class="post-body fade-in">
                        ${post.content}
                    </article>

                    <div class="author-box fade-in">
                        <img src="${post.authorImage || '../../assets/images/Founder/Aditya%20Harsh.jpg'}" class="author-avatar-lg" alt="${post.author}">
                        <div class="author-info">
                            <span class="author-role">${post.authorRole || post.type}</span>
                            <h4>${post.author}</h4>
                            <p class="author-bio">${post.authorBio || 'Mental health advocate and writer at Soulamore.'}</p>
                        </div>
                        ${post.authorLinkedin ? `
                            <a href="${post.authorLinkedin}" target="_blank" style="color:#4ECDC4; text-decoration:none; font-size:0.85rem; font-weight:600; display:inline-flex; align-items:center; gap:6px; padding:8px 18px; border:1px solid rgba(78,205,196,0.4); border-radius:99px; white-space:nowrap;">
                                <i class="fab fa-linkedin"></i> Connect
                            </a>
                        ` : ''}
                    </div>
                `;

                // Show Engagement Floating Bar
                if (engageBar) engageBar.style.display = 'flex';

                // Fetch dynamic likes count
                try {
                    const postRef = doc(db, 'blogs', postId);
                    const docSnap = await getDoc(postRef);
                    if (docSnap.exists()) {
                        document.getElementById('likeCount').innerText = docSnap.data().likes || post.likes || 0;
                    } else {
                        await setDoc(postRef, { likes: post.likes || 0 });
                        document.getElementById('likeCount').innerText = post.likes || 0;
                    }
                } catch (err) {
                    console.warn("Firebase fallback for likes:", err);
                    document.getElementById('likeCount').innerText = post.likes || 0;
                }

                // Render Related Stories
                renderRelatedStories(post);

            } else {
                container.innerHTML = `<div style="text-align:center; padding:80px 20px;"><h2>Post not found</h2><a href="blogs.html" style="color:#4ECDC4;">Back to Stories</a></div>`;
            }
        }

        function renderRelatedStories(currentPost) {
            if (!relatedGrid) return;
            const allPosts = getAllPosts();
            const related = allPosts.filter(p => p.id !== currentPost.id).slice(0, 3);

            let html = '';
            related.forEach(rel => {
                html += `
                    <div class="related-card" onclick="window.location.href='blog-detail.html?id=${rel.id}'">
                        <img src="${rel.image}" alt="${rel.title}">
                        <div class="related-card-body">
                            <div style="font-size:0.75rem; color:#4ECDC4; font-weight:700; margin-bottom:4px;">${rel.type}</div>
                            <div class="related-card-title">${rel.title}</div>
                            <div style="font-size:0.75rem; color:#94a3b8;">${rel.readTime || '5 min read'}</div>
                        </div>
                    </div>
                `;
            });
            relatedGrid.innerHTML = html;
        }

        initPost();

        // ENGAGEMENT ACTIONS
        window.toggleLike = async (btn) => {
            if (isLikeUpdating) return;
            isLikeUpdating = true;

            btn.classList.toggle('active');
            const countEl = document.getElementById('likeCount');
            let count = parseInt(countEl.innerText) || 0;

            try {
                const postRef = doc(db, 'blogs', postId);
                if (btn.classList.contains('active')) {
                    count++;
                    countEl.innerText = count;
                    await updateDoc(postRef, { likes: increment(1) });
                } else {
                    count = Math.max(0, count - 1);
                    countEl.innerText = count;
                    await updateDoc(postRef, { likes: increment(-1) });
                }
            } catch (err) {
                console.warn("Optimistic like toggle fallback:", err);
            } finally {
                isLikeUpdating = false;
            }
        };

        window.copyLink = () => {
            navigator.clipboard.writeText(window.location.href);
            alert('Article link copied to clipboard!');
        };

        window.shareTwitter = () => {
            const url = encodeURIComponent(window.location.href);
            const text = encodeURIComponent(document.title);
            window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, '_blank');
        };
    </script>
</body>

</html>
