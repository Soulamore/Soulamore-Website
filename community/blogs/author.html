<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- DOMAIN ROUTER & CANONICAL -->
    <script>
        (function() {
            var host = window.location.hostname;
            var path = window.location.pathname;
            var search = window.location.search;
            var targetDomain = 'soulamore.com';
            
            // 1. Redirect Firebase Traffic
            if (host.includes('firebaseapp.com') || host.includes('web.app')) {
                window.location.replace('https://' + targetDomain + path + search);
            }
            
            // 2. Canonical Injection
            var canonicalUrl = 'https://' + targetDomain + path;
            var link = document.querySelector('link[rel="canonical"]') || document.createElement('link');
            link.rel = 'canonical';
            link.href = canonicalUrl;
            if (!link.parentNode) document.head.appendChild(link);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Profile | Soulamore Stories</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/global.css">

    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        body.light-mode {
            background-color: var(--bg-main);
            color: var(--text-primary);
        }

        .author-header {
            padding: 130px 20px 50px;
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.6));
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .author-avatar-lg {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #4ECDC4;
            margin-bottom: 16px;
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.25);
        }

        .author-name {
            font-family: 'Outfit', sans-serif;
            font-size: 2.4rem;
            font-weight: 800;
            color: white;
            margin-bottom: 6px;
        }

        .author-role-tag {
            color: #4ECDC4;
            margin-bottom: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-size: 0.82rem;
        }

        .author-bio {
            max-width: 620px;
            margin: 0 auto 20px;
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.65;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .social-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: all 0.2s ease;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .social-btn:hover {
            background: #4ECDC4;
            color: #0f172a;
            transform: translateY(-2px);
        }

        .articles-section {
            padding: 50px 20px 80px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 28px;
        }

        .blog-card {
            background: rgba(30, 41, 59, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .blog-card:hover {
            transform: translateY(-5px);
            border-color: rgba(78, 205, 196, 0.35);
        }

        .blog-img {
            height: 180px;
            background-size: cover;
            background-position: center;
        }

        .blog-content {
            padding: 20px;
        }

        .blog-tag {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4ECDC4;
            margin-bottom: 8px;
            display: block;
            font-weight: 700;
        }

        body.light-mode .author-header {
            background: var(--bg-card);
            border-color: var(--border-subtle);
        }

        body.light-mode .author-name {
            color: var(--text-primary);
        }

        body.light-mode .author-bio {
            color: var(--text-secondary);
        }

        body.light-mode .blog-card {
            background: var(--bg-card);
            border-color: var(--border-subtle);
        }
    </style>
    <link rel="icon" href="../../assets/images/favicon_symbol.webp" type="image/x-icon">
</head>

<body>

    <div id="app-shell">
        <div id="shell-fixed">
            <header></header>
        </div>

        <main id="shell-content">
            <!-- AUTHOR HEADER -->
            <section class="author-header" id="authorHeader">
                <img src="../../assets/images/Founder/Aditya%20Harsh.jpg" class="author-avatar-lg" id="authorAvatar" alt="Author">
                <h1 class="author-name" id="authorName">Aditya Harsh</h1>
                <div class="author-role-tag" id="authorRole">Founder & Mental Health Advocate</div>
                <p class="author-bio" id="authorBio">
                    Founder of Soulamore. Exploring the intersection of culture, technology, and emotional wellness.
                </p>
                <div class="social-links" id="authorSocials">
                    <a href="https://www.linkedin.com/in/aditya-harsh-1101/" target="_blank" class="social-btn"><i class="fab fa-linkedin-in"></i></a>
                    <a href="https://soulamore.com" target="_blank" class="social-btn"><i class="fas fa-globe"></i></a>
                </div>
            </section>

            <!-- ARTICLES -->
            <section class="articles-section">
                <h2 id="sectionTitle" style="font-family:'Outfit'; font-size:1.6rem; font-weight:700; margin-bottom:25px; border-bottom:1px solid rgba(255,255,255,0.08); padding-bottom:12px;">
                    Articles by Aditya Harsh
                </h2>

                <div class="blog-grid" id="author-posts">
                    <!-- Dynamic Articles Injected by JS -->
                </div>
            </section>
        </main>

        <footer></footer>
    </div>

    <script src="../../assets/js/components.js?v=3.6"></script>
    <script type="module">
        import { getAllPosts } from '../../assets/js/blog-data.js';

        const params = new URLSearchParams(window.location.search);
        const authorQuery = params.get('name') || 'Aditya Harsh';

        const allPosts = getAllPosts();
        const authorPosts = allPosts.filter(p => p.author && p.author.toLowerCase().includes(authorQuery.toLowerCase()));

        if (authorPosts.length > 0) {
            const first = authorPosts[0];
            document.getElementById('authorName').textContent = first.author;
            document.getElementById('authorRole').textContent = first.authorRole || first.type || 'Contributor';
            document.getElementById('authorBio').textContent = first.authorBio || 'Mental health advocate and writer at Soulamore.';
            if (first.authorImage) {
                document.getElementById('authorAvatar').src = first.authorImage;
            }
            document.getElementById('sectionTitle').textContent = `Articles by ${first.author}`;
        }

        const grid = document.getElementById('author-posts');
        if (grid) {
            let html = '';
            const postsToRender = authorPosts.length > 0 ? authorPosts : allPosts;

            postsToRender.forEach(post => {
                html += `
                    <div class="blog-card fade-in" onclick="location.href='blog-detail.html?id=${post.id}'">
                        <div class="blog-img" style="background-image: url('${post.image}');"></div>
                        <div class="blog-content">
                            <span class="blog-tag">${post.topic}</span>
                            <h3 style="margin-bottom:8px; font-family:'Outfit'; font-size:1.15rem; font-weight:700; color:#fff;">${post.title}</h3>
                            <p style="color:#94a3b8; font-size:0.88rem; line-height:1.5;">${post.excerpt.substring(0, 100)}...</p>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }
    </script>
</body>

</html>
