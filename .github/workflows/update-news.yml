name: Update Mental Health News

on:
  schedule:
    - cron: '30 2 * * *' # Every day at 8:00 AM IST (2:30 AM UTC)
  push:
    branches:
      - main
      - feature/booking-system-improv-v3
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run News Sync Script
        run: python scripts/smart_news_rituals.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Soulamore Bot"
          git config --global user.email "bot@soulamore.com"
          git add assets/data/news-feed.json || true
          git add assets/data/rituals.json || true
          git commit -m "chore: dynamic news update [skip ci]" || echo "No changes to commit"
          git push
