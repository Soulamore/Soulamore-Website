<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- DOMAIN ROUTER & CANONICAL -->
    <script>
        (function() {
            var host = window.location.hostname;
            var path = window.location.pathname;
            var search = window.location.search;
            var targetDomain = 'soulamore.com';
            
            if (host.includes('firebaseapp.com') || host.includes('web.app')) {
                window.location.replace('https://' + targetDomain + path + search);
            }
            
            var canonicalUrl = 'https://' + targetDomain + path;
            var link = document.querySelector('link[rel="canonical"]') || document.createElement('link');
            link.rel = 'canonical';
            link.href = canonicalUrl;
            if (!link.parentNode) document.head.appendChild(link);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Blog Article | Soulamore</title>
    <meta name="description" id="page-description" content="Warm, empathetic thoughts and grounded perspective on emotional wellbeing.">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Shantell+Sans:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <style>
        :root {
            --bg-deep: #0b1120;
            --text-main: #f8fafc;
            --text-muted: rgba(255, 255, 255, 0.75);
            --accent-teal: #2dd4bf;
            --accent-amber: #fbbf24;
            --accent-blue: #38bdf8;
            --border-soft: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.8;
            min-height: 100vh;
        }

        /* Reading Progress Indicator */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: linear-gradient(90deg, #2dd4bf, #fbbf24);
            width: 0%;
            z-index: 1000;
            transition: width 0.1s ease;
        }

        .article-header {
            background: radial-gradient(circle at 50% 0%, rgba(45, 212, 191, 0.12), transparent 70%);
            padding: 70px 24px 30px;
            text-align: center;
            border-bottom: 1px solid var(--border-soft);
        }

        .article-header-container {
            max-width: 820px;
            margin: 0 auto;
        }

        .pillar-badge {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 700;
            color: var(--accent-teal);
            background: rgba(45, 212, 191, 0.12);
            padding: 5px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .post-heading {
            font-family: 'Outfit', sans-serif;
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.25;
            margin: 0 0 20px 0;
            color: white;
            letter-spacing: -0.5px;
        }

        .post-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            font-size: 0.88rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .article-body-container {
            max-width: 820px;
            margin: 40px auto 100px;
            padding: 0 24px;
        }

        /* --- JOURNAL PAPER SHEET CONTAINER & WRITING SURFACE --- */
        .article-content {
            font-family: 'Lora', 'Patrick Hand', serif;
            font-size: 1.2rem;
            line-height: 1.85;
            color: #e2e8f0;
            background-color: #131a2a;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                radial-gradient(ellipse at 50% 0%, rgba(45, 212, 191, 0.08), transparent 75%);
            background-size: 100% 34px, 100% 100%;
            border-radius: 20px;
            padding: 50px 55px 60px 70px;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 3px double rgba(244, 114, 182, 0.45); /* Journal red margin line */
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5), 
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 0 80px rgba(0, 0, 0, 0.3);
            margin-bottom: 45px;
            transition: all 0.3s ease;
        }

        /* Notebook Binder Punch Holes on Left Margin */
        .article-content::before {
            content: '';
            position: absolute;
            top: 35px;
            left: 18px;
            bottom: 35px;
            width: 14px;
            background-image: radial-gradient(circle, rgba(255, 255, 255, 0.16) 4px, transparent 5px);
            background-size: 14px 42px;
            pointer-events: none;
        }

        .article-content p {
            margin-bottom: 28px;
        }

        /* Journal Subheadings in Aesthetic Cursive Handwriting */
        .article-content h2,
        .article-content h3 {
            font-family: 'Caveat', 'Kalam', cursive;
            color: var(--accent-teal);
            margin-top: 40px;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 2px dashed rgba(45, 212, 191, 0.3);
            padding-bottom: 6px;
            display: inline-block;
        }

        .article-content h2 {
            font-size: 2.3rem;
            line-height: 1.25;
        }

        .article-content h3 {
            font-size: 1.8rem;
        }

        /* Handwritten Sticky Callout Box */
        .article-content blockquote,
        .handwritten-callout {
            border-left: 4px solid var(--accent-amber);
            background: rgba(251, 191, 36, 0.08);
            padding: 20px 24px;
            margin: 32px 0;
            border-radius: 12px;
            font-family: 'Caveat', 'Kalam', cursive;
            font-style: normal;
            font-size: 1.4rem;
            line-height: 1.6;
            color: #fef08a;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            transform: rotate(-0.5deg);
        }

        .article-content blockquote::before {
            content: '📌 Note';
            display: block;
            font-size: 0.85rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-amber);
            margin-bottom: 6px;
        }

        /* CODED STICK DIAGRAM & DOODLE CONTAINERS */
        .stick-diagram-box {
            background: rgba(11, 17, 32, 0.7);
            border: 2px dashed rgba(45, 212, 191, 0.4);
            border-radius: 16px;
            padding: 26px 20px;
            margin: 35px 0;
            text-align: center;
            position: relative;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.4);
        }

        .stick-diagram-caption {
            font-family: 'Caveat', 'Kalam', cursive;
            font-size: 1.35rem;
            color: var(--accent-teal);
            margin-top: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .stick-figure-svg {
            max-width: 100%;
            height: auto;
            stroke: var(--accent-teal);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            filter: drop-shadow(0 2px 8px rgba(45, 212, 191, 0.35));
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--accent-teal);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 24px;
        }

        .nav-back:hover {
            text-decoration: underline;
        }

        /* Share & Back Controls */
        .post-footer-actions {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--border-soft);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .share-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-soft);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .share-btn:hover {
            background: rgba(45, 212, 191, 0.15);
            color: var(--accent-teal);
        }
    </style>

    <!-- Schema.org JSON-LD Placeholder -->
    <script type="application/ld+json" id="json-ld-schema"></script>
    <title>Blog Post | Soulamore</title>

    <!-- SEO & OPEN GRAPH META TAGS -->
    <meta name="description" content="Soulamore is India's leading anonymous emotional support sanctuary. Get affordable online therapy, clinical assessments, and peer counseling.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://soulamore.com/pages/blog-post.html">
    <meta property="og:title" content="Blog Post | Soulamore">
    <meta property="og:description" content="Soulamore is India's leading anonymous emotional support sanctuary. Get affordable online therapy, clinical assessments, and peer counseling.">
    <meta property="og:image" content="https://soulamore.com/assets/images/favicon_symbol.webp">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Blog Post | Soulamore">
    <meta name="twitter:description" content="Soulamore is India's leading anonymous emotional support sanctuary. Get affordable online therapy, clinical assessments, and peer counseling.">
    <meta name="twitter:image" content="https://soulamore.com/assets/images/favicon_symbol.webp">
</head>
<body>
    <div class="progress-bar" id="reading-progress"></div>

    <div class="article-header">
        <div class="article-header-container">
            <a href="/pages/blog.html" class="nav-back"><i class="fas fa-arrow-left"></i> Back to Journal</a>
            <div><span class="pillar-badge" id="post-pillar">Wellbeing</span></div>
            <h1 class="post-heading" id="post-title">Loading perspective...</h1>
            <div class="post-meta">
                <span><i class="far fa-user"></i> <span id="post-author">Soulamore Editorial</span></span>
                <span>•</span>
                <span><i class="far fa-clock"></i> <span id="post-readtime">3 min read</span></span>
            </div>
        </div>
    </div>

    <div class="article-body-container">
        <div class="article-content" id="post-content">
            <div style="text-align: center; padding: 40px; opacity: 0.6;">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
            </div>
        </div>

        <div class="post-footer-actions">
            <a href="/pages/blog.html" class="share-btn"><i class="fas fa-arrow-left"></i> All Articles</a>
            <div style="display: flex; gap: 10px;">
                <button onclick="shareArticle()" class="share-btn"><i class="fas fa-share-alt"></i> Share Article</button>
            </div>
        </div>
    </div>

    <script>
        // Update reading progress bar
        window.addEventListener('scroll', () => {
            const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            const scrolled = (winScroll / height) * 100;
            document.getElementById('reading-progress').style.width = scrolled + '%';
        });

        async function loadArticle() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const id = params.get('id');

            let article = null;

            try {
                const res = await fetch('/assets/data/blog-posts.json?t=' + Date.now());
                if (res.ok) {
                    const posts = await res.json();
                    if (slug) {
                        article = posts.find(p => p.slug === slug);
                    } else if (id) {
                        article = posts.find(p => p.id === id);
                    }
                    // Fallback to first available post if query params missing
                    if (!article && posts.length > 0) {
                        article = posts[0];
                    }
                }
            } catch (err) {
                console.warn("Could not fetch blog-posts.json:", err);
            }

            if (!article) {
                document.getElementById('post-title').innerText = "Article Not Found";
                document.getElementById('post-content').innerHTML = `
                    <p style="text-align: center; color: rgba(255,255,255,0.7);">
                        The requested article could not be loaded. Please return to the <a href="/pages/blog.html" style="color: #2dd4bf; text-decoration: underline;">Soulamore Journal</a> to browse published perspectives.
                    </p>
                `;
                return;
            }

            // Populate Page Elements
            document.getElementById('page-title').innerText = `${article.title} | Soulamore Journal`;
            document.getElementById('page-description').setAttribute('content', article.metaDescription);
            document.getElementById('post-title').innerText = article.title;
            document.getElementById('post-pillar').innerText = (article.pillar || 'wellbeing').replace(/-/g, ' ');
            document.getElementById('post-readtime').innerText = `${article.readTimeMinutes || 3} min read`;
            document.getElementById('post-content').innerHTML = article.content;

            // Ingest Schema.org JSON-LD
            const schemaData = {
                "@context": "https://schema.org",
                "@type": "BlogPosting",
                "headline": article.title,
                "description": article.metaDescription,
                "author": {
                    "@type": "Organization",
                    "name": "Soulamore Editorial Team"
                },
                "publisher": {
                    "@type": "Organization",
                    "name": "Soulamore",
                    "url": "https://soulamore.com"
                },
                "datePublished": article.created_at || new Date().toISOString()
            };
            document.getElementById('json-ld-schema').textContent = JSON.stringify(schemaData);
        }

        function shareArticle() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert("Article URL copied to clipboard!");
            }
        }

        window.addEventListener('DOMContentLoaded', loadArticle);
    </script>
</body>
</html>
