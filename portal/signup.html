    <!-- DOMAIN ROUTER & CANONICAL -->
    <script>
        (function() {
            var host = window.location.hostname;
            var path = window.location.pathname;
            var search = window.location.search;
            var targetDomain = 'soulamore.com';
            
            // 1. Redirect Firebase Traffic
            if (host.includes('firebaseapp.com') || host.includes('web.app')) {
                window.location.replace('https://' + targetDomain + path + search);
            }
            
            // 2. Canonical Injection
            var canonicalUrl = 'https://' + targetDomain + path;
            var link = document.querySelector('link[rel="canonical"]') || document.createElement('link');
            link.rel = 'canonical';
            link.href = canonicalUrl;
            if (!link.parentNode) document.head.appendChild(link);
        })();
    </script>

    <script type="module">
        import { signUpWithEmail, loginWithGoogle } from "../assets/js/auth-service.js"; // Added loginWithGoogle
        import { handleRoleRouting } from "../assets/js/auth-context.js";
        import { updateProfile } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { db, doc, setDoc, serverTimestamp } from "../assets/js/firebase-config.js";

        // Initialize Intent from Session (passed from login page)
        document.addEventListener('DOMContentLoaded', () => {
            const intent = sessionStorage.getItem('signupIntent');
            if (intent) {
                const select = document.getElementById('roleSelect');
                if (select) select.value = intent;
            }
        });

        // 1. Age Gate Handler
        window.handleAgeGate = function (dobValue) {
            if (!dobValue) return;
            const birthDate = new Date(dobValue);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }

            const parentGroup = document.getElementById('parentEmailGroup');
            const parentInput = document.getElementById('parentEmail');

            if (age < 13) {
                alert("Soulamore requires users to be at least 13 years old. You cannot create an account.");
                document.getElementById('userDob').value = '';
                parentGroup.style.display = 'none';
                parentInput.required = false;
            } else if (age >= 13 && age < 18) {
                parentGroup.style.display = 'block';
                parentInput.required = true;
            } else {
                parentGroup.style.display = 'none';
                parentInput.required = false;
            }
        };

        // 2. Password Strength & HIBP Breach Check
        async function sha1(string) {
            const utf8 = new TextEncoder().encode(string);
            const hashBuffer = await crypto.subtle.digest('SHA-1', utf8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex.toUpperCase();
        }

        async function checkPasswordBreach(password) {
            const breachWarning = document.getElementById('breach-warning');
            if (!password || password.length < 4) {
                breachWarning.style.display = 'none';
                return;
            }

            try {
                const hash = await sha1(password);
                const prefix = hash.substring(0, 5);
                const suffix = hash.substring(5);

                const response = await fetch(`https://api.pwnedpasswords.com/range/${prefix}`);
                if (!response.ok) return;

                const text = await response.text();
                const lines = text.split('\n');
                
                let matchCount = 0;
                for (let line of lines) {
                    const [lineSuffix, count] = line.split(':');
                    if (lineSuffix.trim() === suffix) {
                        matchCount = parseInt(count);
                        break;
                    }
                }

                if (matchCount > 0) {
                    breachWarning.textContent = `⚠️ Warning: This password has appeared in ${matchCount.toLocaleString()} data breaches. We recommend using a unique password.`;
                    breachWarning.style.display = 'block';
                } else {
                    breachWarning.style.display = 'none';
                }
            } catch (e) {
                console.warn("Failed to check password breach:", e);
                breachWarning.style.display = 'none';
            }
        }

        window.checkPasswordStrength = function (password) {
            const strengthBar = document.getElementById('strength-bar');
            const strengthText = document.getElementById('strength-text');
            const breachWarning = document.getElementById('breach-warning');

            if (!password) {
                strengthBar.style.width = '0%';
                strengthText.textContent = '';
                breachWarning.style.display = 'none';
                return;
            }

            let score = 0;
            if (password.length >= 8) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^A-Za-z0-9]/.test(password)) score++;

            let width = '0%';
            let color = '#ef4444';
            let text = 'Weak';

            if (password.length < 8) {
                width = '20%';
                color = '#ef4444';
                text = 'Too short (min 8 chars)';
            } else if (score <= 2) {
                width = '40%';
                color = '#f59e0b';
                text = 'Weak';
            } else if (score <= 4) {
                width = '70%';
                color = '#3b82f6';
                text = 'Fair';
            } else {
                width = '100%';
                color = '#10b981';
                text = 'Strong';
            }

            strengthBar.style.width = width;
            strengthBar.style.backgroundColor = color;
            strengthText.textContent = `Strength: ${text}`;
            strengthText.style.color = color;

            clearTimeout(window.breachCheckTimeout);
            window.breachCheckTimeout = setTimeout(() => {
                checkPasswordBreach(password);
            }, 800);
        };

        window.togglePasswordVisibility = function () {
            const pwdInput = document.getElementById('userPassword');
            const toggleIcon = document.getElementById('togglePasswordIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                pwdInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        };

        // Expose handleGoogleSignup to window
        window.handleGoogleSignup = async function () {
            const btn = document.querySelector('.social-btn');
            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting...';

                const result = await loginWithGoogle();
                if (result.success) {
                    // Google Login is also Signup. Force strictly 'user' role.
                    await handleRoleRouting(result.user, 'user', true);
                } else {
                    throw new Error(result.error);
                }
            } catch (e) {
                console.error(e);
                alert("Google Signup Failed: " + e.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fab fa-google" style="color:#DB4437;"></i> Sign up with Google';
            }
        };

        window.handleSignup = async function (e) {
            e.preventDefault();
            const name = document.getElementById('userName').value;
            const email = document.getElementById('userEmail').value;
            const password = document.getElementById('userPassword').value;
            const dob = document.getElementById('userDob').value;
            const parentEmail = document.getElementById('parentEmail').value;
            const consentTerms = document.getElementById('consentTerms').checked;
            const consentMarketing = document.getElementById('consentMarketing').checked;
            const btn = document.querySelector('.submit-btn');

            if (!email || !password || !name || !dob) { alert("Please fill all required fields."); return; }

            if (password.length < 8) {
                alert("Password must be at least 8 characters long.");
                return;
            }

            // Age calculation
            const birthDate = new Date(dob);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const monthDiff = today.getMonth() - birthDate.getMonth();
            if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }

            if (age < 13) {
                alert("Soulamore requires users to be at least 13 years old.");
                return;
            }

            let ageGateTier = 'adult';
            let parentalConsentStatus = 'n/a';

            if (age >= 13 && age < 18) {
                if (!parentEmail) {
                    alert("Please provide a parent or guardian's email address.");
                    return;
                }
                ageGateTier = 'minor';
                parentalConsentStatus = 'pending';
            }

            try {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';

                // Create profile fields metadata
                const additionalData = {
                    dob: dob,
                    ageGateTier: ageGateTier,
                    parentalConsentStatus: parentalConsentStatus,
                    parentEmail: ageGateTier === 'minor' ? parentEmail : '',
                    consentTerms: consentTerms,
                    consentMarketing: consentMarketing,
                    consentWellnessDataProcessing: false // default false, onboarding modal gates it
                };

                // 1. Create User in Firebase
                const result = await signUpWithEmail(email, password, name, additionalData);

                if (result.success && result.user) {
                    // 2. Update Display Name in Firebase Auth profile
                    await updateProfile(result.user, { displayName: name });

                    // 3. Minor Specific flow
                    if (ageGateTier === 'minor') {
                        const consentToken = crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2));
                        
                        // Create record in parental_consents collection
                        await setDoc(doc(db, "parental_consents", consentToken), {
                            minorUserId: result.user.uid,
                            parentEmail: parentEmail,
                            status: 'pending',
                            consentVersion: '1.0',
                            consentTextShown: 'Parent approval requested for child to access Soulamore self-reflection features.',
                            requestSentAt: serverTimestamp(),
                            consentToken: consentToken,
                            consentTokenUsed: false
                        });

                        // Trigger parent approval email via 'mail' collection
                        const approvalLink = `${window.location.origin}/auth/parental-consent.html?token=${consentToken}`;
                        
                        await setDoc(doc(db, "mail", consentToken), {
                            to: parentEmail,
                            message: {
                                subject: `Approval required: ${name}'s Soulamore Account`,
                                html: `
                                    <div style="font-family: Arial, sans-serif; padding: 20px; color: #333; max-width: 600px; margin: 0 auto; border: 1px solid #ddd; border-radius: 8px;">
                                        <h2 style="color: #2a9d8f;">Confirm Your Child's Soulamore Account</h2>
                                        <p>Hello,</p>
                                        <p><strong>${name}</strong> (${email}) has requested to create an account on Soulamore, a private, self-reflection space designed for students and young people.</p>
                                        <p>To protect the privacy of minors, Soulamore requires parent or guardian approval before accounts for users under 18 can be activated. If approved, your child will have access to private journal and mood tracker tools.</p>
                                        <p style="margin-bottom: 25px;">All data is stored securely, encrypted, and is never sold or shared with third parties.</p>
                                        <div style="margin: 30px 0; text-align: center;">
                                            <a href="${approvalLink}" style="background-color: #2a9d8f; color: white; padding: 12px 24px; text-decoration: none; border-radius: 50px; font-weight: bold; display: inline-block;">Approve Account Creation</a>
                                        </div>
                                        <p style="font-size: 0.85rem; color: #666;">If you did not expect this request, you can ignore this email. The pending account will be deleted automatically in 7 days.</p>
                                        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
                                        <p style="font-size: 0.75rem; color: #999;">Hashlilly (OPC) Private Limited, Registered Address, India</p>
                                    </div>
                                `
                            },
                            timestamp: serverTimestamp()
                        });

                        console.log("Parent approval email triggered successfully.");

                        // Force log out immediately to lock minor out, then redirect to pending page
                        const { auth } = await import("../assets/js/firebase-config.js");
                        await auth.signOut();
                        window.location.href = '../auth/parental-consent-pending.html';
                    } else {
                        // 4. Adult routing: Handles session creation
                        const role = sessionStorage.getItem('signupIntent') || 'user';
                        await handleRoleRouting(result.user, role, true);
                    }
                } else {
                    throw new Error(result.error);
                }

            } catch (error) {
                console.error("Signup Error:", error);
                alert("Error creating account: " + error.message);
                btn.disabled = false;
                btn.innerHTML = 'Create Account';
            }
        }
    </script>

    <!-- PARTICLES SCRIPT -->
    <script>
        const pContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            let p = document.createElement('div');
            p.style.position = 'absolute';
            p.style.left = Math.random() * 100 + '%';
            p.style.top = Math.random() * 100 + '%';
            p.style.width = Math.random() * 3 + 'px';
            p.style.height = p.style.width;
            p.style.background = 'white';
            p.style.borderRadius = '50%';
            p.style.opacity = Math.random() * 0.3;
            p.style.animation = `float ${Math.random() * 20 + 10}s linear infinite`;
            pContainer.appendChild(p);
        }
        const style = document.createElement('style');
        style.innerHTML = `@keyframes float { 0% {transform:translateY(0);} 100% {transform:translateY(-100vh);} }`;
        document.head.appendChild(style);
    </script>
</body>
