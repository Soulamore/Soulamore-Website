:.2s"><path d="M12 2a8 8 0 00-8 8v12l3-3 3 3 3-3 3 3 3-3v-12a8 8 0 00-8-8zm-3 8a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0zm6 0a1.5 1.5 0 113 0 1.5 1.5 0 01-3 0z"/></svg><p id="ji" style="font-size:.7rem;opacity:.5;margin-top:5px">(Space to Jump)</p><p id="js" style="font-size:.8rem;font-weight:700;color:var(--pg);display:none">Score: 0</p></div><div class="ed">404</div><h1 class="et">You haven't lost your way.</h1><p class="esc">The page you are looking for isn't here, but you are.<br>Take a moment. Breathe. There is no rush.</p><button class="bb" id="bb" onclick="tB()"><svg viewBox="0 0 512 512"><path d="M352 160a64 64 0 10-64-64 64 64 0 00 64 64zM160 160a64 64 0 10-64-64 64 64 0 00 64 64zm0 192a64 64 0 10-64-64 64 64 0 00 64 64zm192 0a64 64 0 10-64-64 64 64 0 00 64 64z"/></svg> <span id="bt">Take a deep breath</span></button><div class="lr"><a href="index.html" class="np">Go Home</a><a href="pages/problem-wall.html" class="np">Problem Wall</a><a href="tools/5-step-reset.html" class="np">5-Step Reset</a><a href="tools/soulbot.html" class="np">SoulBot AI</a></div></div></main><script>const v=document,c=v.getElementById('c'),x=c.getContext('2d');let w,h,s=[],m={x:null,y:null};window.onmousemove=e=>{m.x=e.x;m.y=e.y};window.ontouchmove=e=>{m.x=e.touches[0].clientX;m.y=e.touches[0].clientY};function r(){w=c.width=window.innerWidth;h=c.height=window.innerHeight}window.onresize=r;r();class S{constructor(){this.x=Math.random()*w;this.y=Math.random()*h;this.s=Math.random()*2;this.vx=(Math.random()-.5)*.5;this.vy=(Math.random()-.5)*.5}u(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>w)this.vx*=-1;if(this.y<0||this.y>h)this.vy*=-1}d(){x.fillStyle="rgba(255,255,255,.6)";x.beginPath();x.arc(this.x,this.y,this.s,0,Math.PI*2);x.fill()}}for(let i=0;i<80;i++)s.push(new S());function a(){x.clearRect(0,0,w,h);s.forEach(o=>{o.u();o.d();let dx=m.x-o.x,dy=m.y-o.y,d=Math.sqrt(dx*dx+dy*dy);if(d<150){x.beginPath();x.strokeStyle=`rgba(78,205,196,${1-d/150})`;x.lineWidth=1;x.moveTo(o.x,o.y);x.lineTo(m.x,m.y);x.stroke()}});requestAnimationFrame(a)}a();function tB(){const b=v.getElementById('bb'),t=v.getElementById('bt');b.classList.add('ba');t.innerText="Inhale...";setTimeout(()=>t.innerText="Hold...",1500);setTimeout(()=>t.innerText="Exhale...",2500);setTimeout(()=>{t.innerText="Take a deep breath";b.classList.remove('ba')},4000)}const u=v.getElementById('au');let p=0;function tA(){if(p){u.pause();v.getElementById('at').innerText="Ambience"}else{u.volume=.3;u.play();v.getElementById('at').innerText="Pause"}p=!p}let n=0;function jS(){const i=v.getElementById('si'),t=v.getElementById('js');if(i.classList.contains('j'))return;i.classList.add('j');setTimeout(()=>i.classList.remove('j'),800);n++;t.style.display='block';t.innerText="Jumps: "+n;v.getElementById('ji').style.opacity='0'}window.onkeydown=e=>{if(e.code==='Space'){e.preventDefault();jS()}}</script></body></html>
